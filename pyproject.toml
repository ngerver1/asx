[project]
name = "asx-platform"
version = "0.1.0"
description = "ASX Structural Alpha Data Platform — proprietary datasets from public disclosures"
# SPEC.md targets Python 3.12; 3.11 is the floor so the platform runs on current LTS images.
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "anthropic>=0.40",
    "rapidfuzz>=3.0",
    # [crypto] is not optional in practice: 55 of the 60 real ASX
    # announcement PDFs captured so far are AES-encrypted (with an empty
    # user password, which pypdf opens silently WHEN a crypto backend is
    # installed). Without it the platform reads 5 documents in 60 and
    # reports nothing wrong.
    "pypdf[crypto]>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
asx = "asx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
